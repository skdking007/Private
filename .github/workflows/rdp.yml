name: Windows RDP via Tailscale (A)

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  RDP_USER: BulletUser
  RDP_PASS: Bullet@12345
  TS_HOSTNAME: bullet

jobs:
  rdp:
    runs-on: windows-2022

    steps:
      - name: 🔧 Resolve inputs
        run: |
          "runtime=355" | Out-File -Append $env:GITHUB_OUTPUT

      - name: ⚙️ Install Tailscale
        run: |
          if (!(Test-Path "C:\Program Files\Tailscale\tailscale.exe")) {
            Invoke-WebRequest https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe -OutFile ts.exe
            Start-Process ts.exe -ArgumentList "/quiet" -Wait
          }

      - name: 🔐 Enable RDP
        run: |
          $sec = ConvertTo-SecureString "${{ env.RDP_PASS }}" -AsPlainText -Force
          New-LocalUser "${{ env.RDP_USER }}" -Password $sec -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group Administrators -Member "${{ env.RDP_USER }}" -ErrorAction SilentlyContinue
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" fDenyTSConnections 0

      - name: 🔗 Tailscale Up
        id: up
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up --hostname "${{ env.TS_HOSTNAME }}"
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          "ip4=$ip" | Out-File -Append $env:GITHUB_OUTPUT

      - name: 📢 Telegram Notify
        run: |
          $token = "${{ secrets.TG_BOT_TOKEN }}"
          $chat  = "${{ secrets.TG_CHAT_ID }}"
          $msg = "🖥️ Windows RDP Ready`nHost: $env:TS_HOSTNAME`nIP: ${{ steps.up.outputs.ip4 }}"
          Invoke-RestMethod -Uri "https://api.telegram.org/bot$token/sendMessage" -Method POST -Body @{chat_id=$chat;text=$msg}

      - name: ⏳ Keep Alive
        run: |
          Start-Sleep -Seconds 300
